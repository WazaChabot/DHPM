name: Déploiement GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les poussées suivantes attendent leur tour.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Le site est servi sous https://<compte>.github.io/<dépôt>/ ; GITHUB_REPOSITORY
      # vaut « compte/dépôt » quel que soit l'événement, y compris un lancement manuel.
      - name: Construire
        run: |
          export DHPM_BASE="/${GITHUB_REPOSITORY#*/}/"
          echo "Base du site : $DHPM_BASE"
          npm run build
      # Sans routeur serveur, une URL profonde doit retomber sur index.html.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
